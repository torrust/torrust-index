[workspace]
members = [
    ".",
    "packages/index-auth-keypair",
    "packages/index-cli-common",
    "packages/index-config",
    "packages/index-config-probe",
    "packages/index-entry-script",
    "packages/index-health-check",
    "packages/mudlark",
    "packages/render-text-as-image",
]

[package]
default-run = "torrust-index"
name = "torrust-index"

authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "4.0.0-develop"

[workspace.package]
authors = ["Nautilus Cyberneering <info@nautilus-cyberneering.de>, Mick van Dijke <mick@dutchbits.nl>"]
categories = ["network-programming", "web-programming"]
description = "A BitTorrent Index"
documentation = "https://docs.rs/torrust-index/"
edition = "2024"
homepage = "https://torrust.com/"
keywords = ["bittorrent", "file-sharing", "index", "peer-to-peer", "torrent"]
license = "AGPL-3.0-only"
publish = true
repository = "https://github.com/torrust/torrust-index"
rust-version = "1.89"

[features]
default = []

[profile.dev]
opt-level = 3

[profile.dev.package.sqlx-macros]
opt-level = 3

[dependencies]
torrust-index-cli-common = { version = "0.1.0", path = "packages/index-cli-common" }
torrust-index-config = { version = "0.1.0", path = "packages/index-config" }
torrust-index-render-text-as-image = { version = "0.1.0", path = "packages/render-text-as-image" }

# argon2 and pbkdf2 must stay on one `password-hash` major: the password
# verification path in `src/services/authentication.rs` builds a `PasswordHash`
# from one crate and verifies it with the other, so a mismatch is a type error.
# Both are held to the 0.x line the sources are written against; a bare `0`
# requirement admits every breaking 0.x release and had let them drift apart.
argon2 = "0.5"
async-trait = "0"
axum = { version = "0", features = ["multipart"] }
axum-server = { version = "0", features = ["tls-rustls"] }
bittorrent-primitives = "0.3"
bytes = "1"
chrono = { version = "0", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
derive_more = { version = "2", features = ["display"] }
email_address = "0"
figment = { version = "0", features = ["env", "test", "toml"] }
futures-util = "0"
hex = "0"
http = "1"
http-body = "1"
hyper = "1"
hyper-util = { version = "0", features = ["http1", "http2", "tokio"] }
indexmap = "2"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
lettre = { version = "0", features = [
    "builder",
    "file-transport-envelope",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
    "tokio1-rustls-tls",
] }
log = "0"
mockall = "0"
pbkdf2 = { version = "0.12", features = ["simple"] }
pin-project-lite = "0"
rand = "0.10"
regex = "1"
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
reqwest = { version = "0", features = ["json", "multipart", "query"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_bencode = "0"
serde_bytes = "0"
serde_derive = "1"
serde_json = "1"
sha-1 = "0"
sha2 = "0"
sqlx = { version = "0", features = ["migrate", "mysql", "runtime-tokio-native-tls", "sqlite", "time"] }
tera = { version = "1", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tower = { version = "0", features = ["timeout"] }
# Held at 0.6: tower-http 0.7 changes response behaviour for features this
# workspace enables. Adopting it is an API decision, not a lock refresh.
tower-http = { version = "0.6", features = ["compression-full", "cors", "propagate-header", "request-id", "trace"] }
tracing = "0"
url = { version = "2", features = ["serde"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
which = "8"

[lints]
workspace = true

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "warn"
unused = { level = "deny", priority = -2 }
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
exit = { level = "deny", priority = 0 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
print_stderr = { level = "deny", priority = 0 }
print_stdout = { level = "deny", priority = 0 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# The `async` on these signatures is contractual, not incidental: axum's
# `FromRequestParts` is an async trait, and the byte-cache methods are async so
# callers keep one shape if a future implementation does await. Dropping it
# would change the public API, which is a design decision, not a lint fix.
unused_async_trait_impl = { level = "allow", priority = 0 }

