name: torrust
services:

  index:
    build:
      context: .
      dockerfile: ./Containerfile
      target: release
    tty: true
    restart: unless-stopped  # Adjust to 'always' or 'no' per deployment needs.
    environment:
      - USER_ID=${USER_ID}
      - TORRUST_INDEX_CONFIG_TOML=${TORRUST_INDEX_CONFIG_TOML}
      - TORRUST_INDEX_DATABASE=${TORRUST_INDEX_DATABASE:-e2e_testing_sqlite3}
      - TORRUST_INDEX_DATABASE_DRIVER=${TORRUST_INDEX_DATABASE_DRIVER:-sqlite3}
      # DEV-ONLY default — change for any public or production deployment.
      - TORRUST_INDEX_CONFIG_OVERRIDE_TRACKER__TOKEN=${TORRUST_INDEX_CONFIG_OVERRIDE_TRACKER__TOKEN:-MyAccessToken}
      # Mandatory at the schema level (ADR-T-009 §D2): the shipped
      # default TOMLs no longer carry a `database.connect_url`, so the
      # operator must inject one. The defaults below match the SQLite
      # path materialised by the entry script and the MySQL service in
      # this compose file.
      - TORRUST_INDEX_CONFIG_OVERRIDE_DATABASE__CONNECT_URL=${TORRUST_INDEX_CONFIG_OVERRIDE_DATABASE__CONNECT_URL:-sqlite:///var/lib/torrust/index/database/sqlite3.db?mode=rwc}
    networks:
      - server_side
    ports:
      - 3001:3001
      - 127.0.0.1:3002:3002
    volumes:
      - ./storage/index/lib:/var/lib/torrust/index:Z
      - ./storage/index/log:/var/log/torrust/index:Z
      - ./storage/index/etc:/etc/torrust/index:Z
    depends_on:
      - tracker
      - mailcatcher
      - mysql

  tracker:
    image: torrust/tracker:develop
    tty: true
    restart: unless-stopped  # Adjust to 'always' or 'no' per deployment needs.
    environment:
      - USER_ID=${USER_ID}
      - TORRUST_TRACKER_CONFIG_TOML=${TORRUST_TRACKER_CONFIG_TOML}
      - TORRUST_TRACKER_DATABASE=${TORRUST_TRACKER_DATABASE:-e2e_testing_sqlite3}
      - TORRUST_TRACKER_CONFIG_OVERRIDE_CORE__DATABASE__DRIVER=${TORRUST_TRACKER_CONFIG_OVERRIDE_CORE__DATABASE__DRIVER:-Sqlite3}
      # DEV-ONLY default — change for any public or production deployment.
      - TORRUST_TRACKER_CONFIG_OVERRIDE_HTTP_API__ACCESS_TOKENS__ADMIN=${TORRUST_TRACKER_CONFIG_OVERRIDE_HTTP_API__ACCESS_TOKENS__ADMIN:-MyAccessToken}
    networks:
      - server_side
    ports:
      - 127.0.0.1:6969:6969/udp
      - 127.0.0.1:7070:7070
      - 127.0.0.1:1212:1212
    volumes:
      - ./storage/tracker/lib:/var/lib/torrust/tracker:Z
      - ./storage/tracker/log:/var/log/torrust/tracker:Z
      - ./storage/tracker/etc:/etc/torrust/tracker:Z
    depends_on:
      - mysql

  mailcatcher:
    image: dockage/mailcatcher:0.8.2
    networks:
      - server_side
    ports:
      - 127.0.0.1:1080:1080
      - 127.0.0.1:1025:1025

  mysql:
    image: mysql:8.0.45
    command: '--authentication-policy=mysql_native_password'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 --password="$$MYSQL_ROOT_PASSWORD" --silent'
        ]
      interval: 3s
      retries: 5
      start_period: 30s
    environment:
      - MYSQL_ROOT_HOST=%
      # DEV-ONLY credentials — change for any public or production deployment.
      # TODO: Migrate to Docker secrets for credential management.
      - MYSQL_ROOT_PASSWORD=root_secret_password
      - MYSQL_DATABASE=${TORRUST_INDEX_MYSQL_DATABASE:-torrust_index_e2e_testing}
      - MYSQL_USER=db_user
      - MYSQL_PASSWORD=db_user_secret_password
    networks:
      - server_side
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - mysql_data:/var/lib/mysql

networks:
  server_side: {}

volumes:
  mysql_data: {}
