[package]
name = "torrust-index-config-probe"

authors.workspace = true
description = "Resolves the Torrust Index configuration and emits the container-relevant subset as JSON"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
torrust-index-cli-common = { version = "4.0.0-develop", path = "../index-cli-common" }
torrust-index-config = { version = "4.0.0-develop", path = "../index-config" }

clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0"
url = "2"

[lints]
workspace = true
