[package]
name = "torrust-index-config"

authors.workspace = true
description = "Configuration schema and loader for the Torrust Index"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[dependencies]
camino = { version = "1", features = ["serde"] }
derive_more = { version = "2", features = ["display"] }
figment = { version = "0", default-features = false, features = ["env", "toml"] }
lettre = { version = "0", default-features = false, features = ["builder", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
thiserror = "2"
toml = "1"
tracing = "0"
url = { version = "2", features = ["serde"] }

[lints]
workspace = true
